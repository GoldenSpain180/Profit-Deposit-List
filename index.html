<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golden Investment Spain</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#14213d;--muted:#5b6478;--accent:#1d4ed8;--line:#dfe4ee;--okbg:#e8f7ee;--okfg:#14532d;--warnbg:#fff4e0;--warnfg:#7a4b00;--badbg:#fdecec;--badfg:#8a1c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#182033;--text:#e8ecf6;--muted:#9aa5bd;--accent:#6b9bff;--line:#2a3550;--okbg:#12301f;--okfg:#9be3b4;--warnbg:#3a2c0f;--warnfg:#ffd27a;--badbg:#3b1717;--badfg:#ffb3b3}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#182033;--text:#e8ecf6;--muted:#9aa5bd;--accent:#6b9bff;--line:#2a3550;--okbg:#12301f;--okfg:#9be3b4;--warnbg:#3a2c0f;--warnfg:#ffd27a;--badbg:#3b1717;--badfg:#ffb3b3}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:20px 16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:1.7rem;margin:12px 0 4px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 20px}
.warn{background:var(--warnbg);color:var(--warnfg);border-radius:12px;padding:14px 16px;font-size:.95rem;line-height:1.45;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
label{font-weight:600;display:block;margin-bottom:8px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font-size:1rem;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{font-size:1rem;font-weight:600;padding:13px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0b1020}}
#out{margin-top:16px}
.hint{color:var(--muted);font-size:.9rem}
.res{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.res .top{background:var(--okbg);color:var(--okfg);padding:10px 14px;font-weight:700;font-size:.9rem}
.res dl{margin:0;padding:6px 14px 10px}
.res .r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.res .r:last-child{border:0}
dt{color:var(--muted)}dd{margin:0;font-weight:600;text-align:right}
.bad{background:var(--badbg);color:var(--badfg);border-radius:12px;padding:14px 16px;line-height:1.45}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Deposit Withdrawal List</h1>
  <p class="sub">December profit deposit list</p>

  <div class="warn"><strong>⚠ Warning:</strong> If you can’t find your name on the list, it means your deposit is <strong>invalid</strong>.</div>

  <div class="card">
    <label for="q">Search your full name</label>
    <div class="row">
      <input id="q" type="text" placeholder="Name or withdrawal code" autocomplete="off">
      <button id="go" type="button">Search</button>
    </div>
    <div id="out"><p class="hint">Type your name and tap Search.</p></div>
  </div>
  <p class="foot">Secured</p>
</div>

<script>
// ---- Sample (test) data: random Spanish and American names ----
var maleES=["Carlos","Javier","Miguel","Alejandro","Diego","Pablo","Sergio","Andrés","Luis","Fernando","Raúl","Iván","Adrián","Rafael","Álvaro"];
var femaleES=["María","Lucía","Carmen","Sofía","Isabel","Laura","Paula","Elena","Marta","Ana","Cristina","Pilar","Rocío","Natalia","Beatriz"];
var maleUS=["James","Michael","Robert","David","William","Joseph","Daniel","Matthew","Anthony","Ryan","Tyler","Brandon","Kevin","Justin","Nathan"];
var femaleUS=["Jennifer","Jessica","Ashley","Emily","Sarah","Megan","Rachel","Lauren","Amanda","Brittany","Olivia","Hannah","Samantha","Nicole","Kayla"];
var surES=["García","Rodríguez","Martínez","López","Hernández","González","Pérez","Sánchez","Ramírez","Torres","Flores","Díaz","Moreno","Romero","Navarro","Ortega","Vargas","Castillo","Molina","Herrera"];
var surUS=["Smith","Johnson","Williams","Brown","Jones","Miller","Davis","Wilson","Anderson","Taylor","Thomas","Moore","Jackson","Martin","Thompson","Clark","Lewis","Walker","Hall","Young"];

var seed=20261201;
function rnd(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}
function pick(a){return a[Math.floor(rnd()*a.length)]}

var list=[],used={};
while(list.length<150){
  var es=rnd()<0.5, male=rnd()<0.5, first;
  if(es) first=pick(male?maleES:femaleES); else first=pick(male?maleUS:femaleUS);
  var name=first+" "+pick(es?surES:surUS);
  if(used[name.toLowerCase()]) continue;
  used[name.toLowerCase()]=1;
  var amt=Math.round((500000+rnd()*2000000)/5000)*5000;
  list.push({name:name,gender:male?"Male":"Female",amount:amt,cur:"€"});
}
// Owner entry
list.push({name:"Stacy Heats",gender:"Female",amount:1900000,cur:"£"});

// ---- Private entry: encrypted, opens only with the withdrawal code ----
var VAULT={s:"iDv8e3Qo88RZS2WLZWoKrw==",iv:"TVbZxxAbn89EY/w4",d:"IZieiowQXlEOLbNUoOyizyeipfwiSS1Ag0Cse7UCfAoPi9UeNHNkzJcm1s2Yh9FQOb6FN2Pw60XR86djW2Fy1Opd+p6g4qvjCXc6ojBX5zdB4oQyfwQur3LAZLCIMdhd/v59iZt2T9F8UmY="};
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function unlock(code){
  var out=document.getElementById("out");
  out.innerHTML='<p class="hint">Checking code…</p>';
  try{
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(VAULT.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(VAULT.iv)},key,b64(VAULT.d));
    var p=JSON.parse(new TextDecoder().decode(buf));
    out.innerHTML='<div class="res"><div class="top">✔ Withdrawal code accepted</div><dl>'+
      '<div class="r"><dt>Name</dt><dd>'+esc(p.name)+'</dd></div>'+
      '<div class="r"><dt>Gender</dt><dd>'+esc(p.gender)+'</dd></div>'+
      '<div class="r"><dt>Profit amount</dt><dd>'+fmt(p.amount,"£")+'</dd></div>'+
      '<div class="r"><dt>Partner name</dt><dd>'+esc(p.partner)+'</dd></div></dl></div>';
  }catch(e){
    out.innerHTML='<div class="bad"><strong>Invalid withdrawal code.</strong><br>Please check the code and try again.</div>';
  }
}

// ---- Search (list is never displayed) ----
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim()}
function fmt(n,c){return c+n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function search(){
  var raw=document.getElementById("q").value, q=norm(raw), out=document.getElementById("out");
  if(/^\d{6,}$/.test(raw.trim())){unlock(raw.trim());return}
  if(q.length<3){out.innerHTML='<p class="hint">Please enter at least 3 characters of your name.</p>';return}
  var hits=list.filter(function(p){return norm(p.name).indexOf(q)!==-1}).slice(0,3);
  if(!hits.length){
    out.innerHTML='<div class="bad"><strong>Name not found.</strong><br>“'+esc(raw.trim())+'” is not on the December profit deposit list. Your deposit is <strong>invalid</strong>.</div>';
    return;
  }
  out.innerHTML=hits.map(function(p){
    return '<div class="res"><div class="top">✔ Name found on the December list</div><dl>'+
      '<div class="r"><dt>Name</dt><dd>'+esc(p.name)+'</dd></div>'+
      '<div class="r"><dt>Gender</dt><dd>'+p.gender+'</dd></div>'+
      '<div class="r"><dt>Profit amount</dt><dd>'+fmt(p.amount,p.cur)+'</dd></div></dl></div>';
  }).join("");
}
document.getElementById("go").addEventListener("click",search);
document.getElementById("q").addEventListener("keydown",function(e){if(e.key==="Enter")search()});
</script>
</body>
</html>
